<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Aplicación PWA - JOFM</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#646cff" />
  </head>
  <body>
    <div id="root"></div>
    
    <!-- ⚡ REGISTRAR SERVICE WORKER PRIMERO - ANTES DE REACT -->
    <script>
      (function() {
        console.log('🚀 [BOOT] Iniciando registro temprano de Service Worker...');
        
        if ('serviceWorker' in navigator) {
          // Registrar INMEDIATAMENTE sin esperar a que cargue React
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(registration => {
              console.log('✅ [BOOT] Service Worker registrado exitosamente:', registration.scope);
              
              // Mostrar cuando hay actualizaciones
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                console.log('🔄 [BOOT] Actualización de SW encontrada');
                
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('📦 [BOOT] Nueva versión del SW lista');
                      // Guardar en localStorage para notificar a la app
                      localStorage.setItem('swUpdateAvailable', 'true');
                      window.dispatchEvent(new Event('swUpdateAvailable'));
                    }
                  });
                }
              });

              // Escuchar cuando el SW toma control
              navigator.serviceWorker.addEventListener('controllerchange', () => {
                console.log('🚀 [BOOT] Nuevo SW tomó control');
              });
            })
            .catch(error => {
              console.error('❌ [BOOT] Error registrando SW:', error);
            });
        } else {
          console.warn('⚠️ [BOOT] Service Worker no soportado en este navegador');
        }
      })();
    </script>

    <!-- ⚡ LUEGO CARGAR REACT -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
