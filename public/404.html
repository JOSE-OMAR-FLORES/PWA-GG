<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Página No Encontrada</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      padding: 20px;
    }

    .container-404 {
      text-align: center;
      max-width: 500px;
      animation: slideIn 0.6s ease-out;
    }

    .error-icon {
      font-size: 6rem;
      margin-bottom: 1.5rem;
      animation: bounce 2s infinite;
    }

    .error-title {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #646cff 0%, #747bff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .error-subtitle {
      font-size: 1.125rem;
      color: #cccccc;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    .error-description {
      background: rgba(100, 108, 255, 0.1);
      border: 1px solid rgba(100, 108, 255, 0.3);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      color: #ffcc00;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn {
      padding: 0.875rem 1.75rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 44px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #646cff 0%, #747bff 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(100, 108, 255, 0.3);
    }

    .btn-secondary {
      background: transparent;
      color: #646cff;
      border: 2px solid #646cff;
    }

    .btn-secondary:hover {
      background: rgba(100, 108, 255, 0.1);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-10px);
      }
      60% {
        transform: translateY(-5px);
      }
    }

    @media (max-width: 480px) {
      .error-icon {
        font-size: 4rem;
      }

      .error-title {
        font-size: 1.75rem;
      }

      .error-subtitle {
        font-size: 1rem;
      }

      .btn {
        width: 100%;
      }

      .actions {
        gap: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="container-404">
    <div class="error-icon">🔍</div>
    
    <h1 class="error-title">404 - No Encontrado</h1>
    
    <p class="error-subtitle">
      La página que buscas no existe.
    </p>

    <div class="error-description">
      ⚠️ Verifica la URL e intenta de nuevo, o vuelve a la página de inicio.
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="goHome()">
        🏠 Ir al Inicio
      </button>
      <button class="btn btn-secondary" onclick="goBack()">
        ⬅️ Volver Atrás
      </button>
    </div>
  </div>

  <script>
    function goHome() {
      window.location.href = '/';
    }

    function goBack() {
      window.history.back();
    }
  </script>
</body>
</html>
