<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - Mi PWA</title>
  <style>
    body { background: #222; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .offline-icon { font-size: 5rem; margin-bottom: 1rem; }
    .offline-msg { font-size: 1.5rem; margin-bottom: 1rem; }
    .offline-hint { color: #ffcc00; }
  </style>
</head>
<body>
  <div class="offline-icon">📴</div>
  <div class="offline-msg">Estás sin conexión</div>
  <div class="offline-hint">Puedes seguir usando la app si ya la habías abierto antes.</div>
</body>
</html>
